[project]
name = "fvmodel"
version = "0.1.0"
description = "A Fair Value stock dashboard built from public data (SEC EDGAR + market prices)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "jinja2>=3.1",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fvmodel = "fvmodel.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fvmodel*"]

[tool.setuptools.package-data]
fvmodel = ["templates/*.j2"]
