name: Treasury timing gauges

# Recomputes the short/mid/long US Treasury buy-sell gauges behind
# docs/bond_timing.html from FRED macro data and Yahoo ETF prices, and commits
# docs/data/bonds.js. Stdlib only, takes a few seconds.
#
# FRED posts the previous day's Treasury yields during the US afternoon, so the
# run is scheduled after that.

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC, Monday to Friday
  workflow_dispatch: {}

permissions:
  contents: write

env:
  MISE_YES: "1"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

concurrency:
  group: bond-signals
  cancel-in-progress: false

jobs:
  bonds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise (Python)
        uses: jdx/mise-action@v2

      - name: Compute the gauges
        run: mise run bonds

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/bonds.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Treasury timing gauges: $(date -u +%F) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1
