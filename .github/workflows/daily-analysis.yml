name: Daily index analysis

# Runs every morning and scrapes AlphaSpread valuations of the NASDAQ-100, the
# S&P 500 and the STOXX Europe 600:
#
#   alphaspread  scrapes AlphaSpread, commits dated HTML + PNG charts and the
#                valuation JSON to generated/alphaspread/, and publishes dated
#                snapshots to docs/data/alphaspread/.
#   stoxx600     the same AlphaSpread run for the STOXX Europe 600 (constituents
#                from iShares ETF holdings). It runs after `alphaspread`, because
#                both rebuild docs/data/alphaspread/manifest.js.
#
# The Fair Value model runs separately in fairvalue.yml. The two workflows write
# disjoint files, so each rebases onto the other's commit before pushing.
#
# Tools and dependencies come from mise (mise.toml, fairvalue/mise.toml): the
# steps run the same `mise run` tasks as a local checkout.

on:
  schedule:
    - cron: "30 6 * * *"     # 06:30 UTC daily (times are always UTC on GitHub)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write             # needed to push the generated files back

env:
  MISE_YES: "1"                                        # never prompt
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}   # trust the repo's mise.toml files

concurrency:
  group: daily-index-analysis
  cancel-in-progress: false   # never abort a run midway through scraping

jobs:
  alphaspread:
    runs-on: ubuntu-latest
    timeout-minutes: 120       # ~600 sequential scrapes with polite delays
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise (Python, uv)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      # kaleido>=1.0 renders the PNGs through a headless Chrome. If Chrome is
      # unavailable the run still succeeds — the script writes the HTML and only
      # warns about the missing PNG — but we install Chrome so PNGs are produced.
      - name: Install Chrome for PNG export
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Fetch a kaleido-compatible Chrome (fallback, non-fatal)
        run: mise exec -- plotly_get_chrome -y || true

      - name: NASDAQ-100 analysis
        run: mise run alphaspread nasdaq100 --date "$(date -u +%F)" --overwrite

      - name: S&P 500 analysis
        run: mise run alphaspread sp500 --date "$(date -u +%F)" --overwrite

      - name: Publish dated snapshots for the site
        run: |
          DATE=$(date -u +%F)
          mise run publish alphaspread nasdaq100 --date "$DATE"
          mise run publish alphaspread sp500 --date "$DATE"

      # GICS sectors for the sector pages. Non-fatal: on failure the last
      # published map stays in place.
      - name: Refresh the S&P 500 sector map
        run: mise run sectors || echo "::warning::Sector refresh failed; keeping the previous map."

      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%F)
          git add generated/alphaspread docs/data/alphaspread generated/sp500_sectors.json docs/data/sp500_sectors.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily AlphaSpread analysis: ${DATE} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1

  stoxx600:
    needs: alphaspread
    if: ${{ !cancelled() }}    # still run when the US job failed
    runs-on: ubuntu-latest
    timeout-minutes: 330       # 600 stocks x 2 pages, paced to stay under AlphaSpread's rate limit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise (Python, uv)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Install Chrome for PNG export
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Fetch a kaleido-compatible Chrome (fallback, non-fatal)
        run: mise exec -- plotly_get_chrome -y || true

      - name: STOXX Europe 600 analysis
        env:
          ALPHASPREAD_DELAY: "8"   # AlphaSpread blocks an IP for an hour after ~400 fast requests
        run: mise run alphaspread stoxx600 --date "$(date -u +%F)" --overwrite

      - name: Publish the dated snapshot for the site
        run: |
          git pull --rebase --autostash   # pick up the US job's manifest first
          mise run publish alphaspread stoxx600 --date "$(date -u +%F)"

      - name: Refresh the STOXX 600 sector map
        run: mise run stoxx600-sectors || echo "::warning::STOXX 600 sector refresh failed; keeping the previous map."

      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%F)
          git add generated/alphaspread docs/data/alphaspread generated/stoxx600_sectors.json docs/data/stoxx600_sectors.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily AlphaSpread STOXX 600 analysis: ${DATE} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1
